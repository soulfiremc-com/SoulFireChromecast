lefthook: bunx --no-install lefthook
min_version: 2.2.2

pre-commit:
  commands:
    oxlint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bunx --no-install oxlint --fix {staged_files}
      stage_fixed: true
    oxfmt:
      run: bunx --no-install oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

pre-push:
  commands:
    types:
      glob: "*.{ts,tsx,json,jsonc}"
      run: bun run typecheck
